name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        description: "Platform To Build On"
        default: "MacOS"
        type: choice
        options:
          - MacOS
          - Windows

jobs:
  build-macos:
    name: MacOS
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - name: Build application
      run: |
        cmake -B build
        cmake --build build
        ls && ls build

  build-windows:
    name: Windows
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - name: Build application
      run: |
        cmake -B build
        cmake --build build
        ls && ls build

#    if: ${{ inputs.platform == 'macos' }}
#    if: ${{ inputs.platform == 'windows' }}
