name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        description: "Platform To Build On"
        default: "Both"
        type: choice
        options:
          - Both
          - MacOS
          - Windows
          - Windows-x64
          - Windows-x86

jobs:
  build-macos:
    name: MacOS
    if: ${{ inputs.platform == 'MacOS' || inputs.platform == 'Both' }}
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        cmake -B build "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
        cmake --build build
    - name: Zip .app
      run: |
        cd build
        zip -r "../Templum Serpentis.zip" "Templum Serpentis.app"
    - name: Upload .zip
      uses: actions/upload-artifact@v7
      with:
        name: "Templum Serpentis.app.zip"
        path: "./Templum Serpentis.zip"

  build-windows-x64:
    name: Windows x64
    if: ${{ inputs.platform == 'Windows' || inputs.platform == 'Windows-x64' || inputs.platform == 'Both' }}
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - name: Build application
      run: |
        cmake -G "MinGW Makefiles" -B build -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_RC_COMPILER=windres
        cmake --build build --config Release
    - name: Zip application and data files together
      run: |
        mkdir "Templum Serpentis"
        mv build/TemplumSerpentis.exe "Templum Serpentis"
        mv build/lib* "Templum Serpentis"
        mv data "Templum Serpentis"
    - name: Upload .zip
      uses: actions/upload-artifact@v7
      with:
        name: "Templum Serpentis-x64.zip"
        path: "./Templum Serpentis"

  build-windows-x86:
    name: Windows x86
    if: ${{ inputs.platform == 'Windows' || inputs.platform == 'Windows-x86' || inputs.platform == 'Both' }}
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - name: Add compiler to PATH
      run: |
        echo (Join-Path C: mingw32 bin) >> $env:GITHUB_PATH
    - name: Build application
      run: |
        cmake -G "MinGW Makefiles" -B build -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ -DCMAKE_RC_COMPILER=windres
        cmake --build build --config Release
    - name: Zip application and data files together
      run: |
        mkdir "Templum Serpentis"
        mv build/TemplumSerpentis.exe "Templum Serpentis"
        mv build/lib* "Templum Serpentis"
        mv data "Templum Serpentis"
    - name: Upload .zip
      uses: actions/upload-artifact@v7
      with:
        name: "Templum Serpentis-x86.zip"
        path: "./Templum Serpentis"
